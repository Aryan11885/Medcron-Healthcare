<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" sizes="192x192" href="https://www.medcronhealthcare.in/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://www.medcronhealthcare.in/logo.jpg" />

    <!-- Responsive -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Security -->
    <meta name="referrer" content="strict-origin" />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Title & SEO -->
    <title>Medcron Healthcare | Quality Medicines, Wellness Products & Healthcare Solutions</title>

    <meta name="description"
          content="Medcron Healthcare provides high-quality medicines, wellness essentials, and healthcare products focused on safety, trust, and patient well-being." />
    <meta name="author" content="Medcron Healthcare" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.medcronhealthcare.in/" />

    <!-- Google Search Console -->
    <meta name="google-site-verification" content="_bNR7UQn7wNh2ksUpHzW46NzBGJHOVAni-ckgu-ZRzc" />

    <!-- Open Graph -->
    <meta property="og:title" content="Medcron Healthcare | Trusted Medicinal Products" />
    <meta property="og:description"
          content="Providing high-quality medicinal products and healthcare services for a healthier future." />
    <meta property="og:image" content="https://www.medcronhealthcare.in/logo.jpg" />
    <meta property="og:url" content="https://www.medcronhealthcare.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medcron Healthcare" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Medcron Healthcare" />
    <meta name="twitter:description"
          content="Reliable medicinal products and healthcare solutions from Medcron Healthcare." />
    <meta name="twitter:image" content="https://www.medcronhealthcare.in/logo.jpg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Medcron Healthcare",
      "url": "https://www.medcronhealthcare.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.medcronhealthcare.in/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Medcron Healthcare",
      "url": "https://www.medcronhealthcare.in",
      "logo": "https://www.medcronhealthcare.in/logo.jpg",
      "sameAs": []
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Medcron Healthcare Homepage",
      "url": "https://www.medcronhealthcare.in",
      "description": "Medcron Healthcare provides medicines, wellness essentials, and healthcare solutions with a focus on safety and trust."
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://www.medcronhealthcare.in"
        }
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Medcron Healthcare?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Medcron Healthcare is a trusted provider of medicines, wellness essentials, and medical products with a focus on quality and patient care."
          }
        },
        {
          "@type": "Question",
          "name": "Are Medcron products reliable?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, all products undergo quality testing to ensure effectiveness, safety, and trust."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- React Entry Point (Vite) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
